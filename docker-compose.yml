name: sky-dev-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sdp}
      POSTGRES_USER: ${POSTGRES_USER:-sdp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sdp-local-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sdp} -d ${POSTGRES_DB:-sdp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./services/core
      dockerfile: Dockerfile.api
    environment:
      SDP_ENVIRONMENT: development
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sdp}:${POSTGRES_PASSWORD:-sdp-local-only}@postgres:5432/${POSTGRES_DB:-sdp}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./services/core
      dockerfile: Dockerfile.worker
    environment:
      SDP_ENVIRONMENT: development
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sdp}:${POSTGRES_PASSWORD:-sdp-local-only}@postgres:5432/${POSTGRES_DB:-sdp}
      REDIS_URL: redis://redis:6379/0
      QUEUE_NAME: ${QUEUE_NAME:-default}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_OWNER: ${GITHUB_OWNER:-}
      GITHUB_OWNER_TYPE: ${GITHUB_OWNER_TYPE:-organization}
      GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}
      GITHUB_REPOSITORY_PRIVATE: ${GITHUB_REPOSITORY_PRIVATE:-true}
      VERCEL_TOKEN: ${VERCEL_TOKEN:-}
      VERCEL_TEAM_ID: ${VERCEL_TEAM_ID:-}
      VERCEL_API_URL: ${VERCEL_API_URL:-https://api.vercel.com}
      RAILWAY_TOKEN: ${RAILWAY_TOKEN:-}
      RAILWAY_WORKSPACE_ID: ${RAILWAY_WORKSPACE_ID:-}
      RAILWAY_API_URL: ${RAILWAY_API_URL:-https://backboard.railway.com/graphql/v2}
      DEPLOYMENT_POLL_INTERVAL_SECONDS: ${DEPLOYMENT_POLL_INTERVAL_SECONDS:-5}
      DEPLOYMENT_TIMEOUT_SECONDS: ${DEPLOYMENT_TIMEOUT_SECONDS:-900}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
